# =============================================================================
# vodafonepaycomtr (site) — standalone compose.
#
# Run FROM THIS FOLDER: `cd vodafonepaycomtr && docker compose up -d app`
# (previously this lived at the monorepo root and orchestrated the CMS too —
# see tasks.md item 39: CMS moved to its own repo/deployment, "clover"
# (../../clover locally, github.com/bbatus/clover). Each service now brings
# itself up independently, exactly like two separate OCP deployments would.
#
# Talks to Clover over the shared external Docker network `vodafonepay-net`
# (create once: `docker network create vodafonepay-net`) — Clover's compose
# joins the same network, so `http://clover:3000` resolves by container name,
# the same way two Services would resolve each other inside one OCP namespace.
# =============================================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: vodafonepaycomtr:latest
    container_name: vodafonepaycomtr
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - CMS_API_URL=http://clover:3000/api
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-dev-revalidate-secret}
      - PREVIEW_SECRET=${PREVIEW_SECRET:-dev-preview-secret}
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vodafonepay-net

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: vodafonepaycomtr:dev
    container_name: vodafonepaycomtr-dev
    restart: unless-stopped
    ports:
      - "${DEV_PORT:-3001}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - CMS_API_URL=http://clover:3000/api
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-dev-revalidate-secret}
      - PREVIEW_SECRET=${PREVIEW_SECRET:-dev-preview-secret}
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - vodafonepay-net

networks:
  vodafonepay-net:
    external: true
