# ŞABLON — gerçek parola commit edilmez.
#     cp k8s/.env.secret.example k8s/.env.secret && ./k8s/create-secret.sh
apiVersion: v1
kind: Secret
metadata:
  name: vodafonepaycomtr-secret
  namespace: vepas-ai-am
  labels: { app: vodafonepaycomtr }
type: Opaque
stringData:
  # Clover'daki DEĞERLERLE BİREBİR AYNI OLMALI — aynı webhook'u
  # imzalıyor(Clover)/doğruluyor(site burada).
  REVALIDATE_SECRET: "${REVALIDATE_SECRET}"
  PREVIEW_SECRET: "${PREVIEW_SECRET}"
