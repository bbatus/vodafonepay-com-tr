# ORTAM: TEST (tst-vcloud, namespace vepas-ai-am)
# Pipeline tarafından UYGULANMAZ — elle: oc apply + oc rollout restart
apiVersion: v1
kind: ConfigMap
metadata:
  name: vodafonepaycomtr-config
  namespace: vepas-ai-am
  labels: { app: vodafonepaycomtr }
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  # Clover'ın OCP Service'i — aynı namespace, container/Service adıyla
  # çözülüyor (yerelde docker-compose'daki `http://clover:3000/api`'nin
  # OCP karşılığı, aynı isim).
  CMS_API_URL: "http://clover:3000/api"
