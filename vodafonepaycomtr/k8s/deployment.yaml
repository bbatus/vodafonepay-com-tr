# =============================================================================
# vodafonepaycomtr (site) — Deployment, namespace vepas-ai-am, TEST cluster
# only (tst-vcloud). See ../../docs/OCP-DEVOPS-RUNBOOK.md.
#
# ${IMAGE_REF} filled by the pipeline via envsubst.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vodafonepaycomtr
  namespace: vepas-ai-am
  labels: { app: vodafonepaycomtr }
spec:
  # S12: starting at 1 replica while this is still test-only.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: vodafonepaycomtr } }
  template:
    metadata:
      labels: { app: vodafonepaycomtr }
    spec:
      serviceAccountName: vodafonepaycomtr
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 45
      containers:
        - name: vodafonepaycomtr
          image: ${IMAGE_REF}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports: [ { name: http, containerPort: 3000 } ]
          envFrom:
            - configMapRef: { name: vodafonepaycomtr-config }
            - secretRef:    { name: vodafonepaycomtr-secret }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }

          startupProbe:
            httpGet: { path: /api/health/liveness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /api/health/liveness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/health/readiness, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
      volumes:
        - { name: tmp, emptyDir: {} }
